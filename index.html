// ---------- Цвета ----------
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mix(a, b, t) {
  const A = hex(a), B = hex(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- Схема города ----------
// Слои: 0 — небо, 1 — дальние дома и облака, 2 — ближние дома и земля, 3 — окна, луна, кайма.
// При N цветах слой L вяжется цветом active[min(L, N-1)].
const COLS = 64, ROWS = 44, N = COLS * ROWS;
const G = [...Array(ROWS)].map(() => new Uint8Array(COLS));
(function buildCity() {
  const R = rng(11);
  const set = (r, c, v) => { if (r >= 0 && r < ROWS && c >= 0 && c < COLS) G[r][c] = v; };
  const ground = ROWS - 5;

  // луна-полумесяц
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const d1 = (c - 51) ** 2 + ((r - 8) * 1.25) ** 2, d2 = (c - 49) ** 2 + ((r - 7) * 1.25) ** 2;
    if (d1 <= 22 && d2 > 16) set(r, c, 3);
  }
  // звёзды
  [[4, 8], [7, 18], [3, 27], [10, 36], [5, 42], [12, 6], [13, 58], [3, 60], [9, 24]].forEach(([r, c]) => set(r, c, 3));
  // облака
  const cloud = (r0, c0, w) => {
    for (let r = -2; r <= 1; r++) for (let c = -w; c <= w; c++)
      if ((c / w) ** 2 + ((r + .5) / 2) ** 2 < 1 - (r === -2 ? .5 : 0) * Math.abs(c / w)) set(r0 + r, c0 + c, 1);
  };
  cloud(6, 12, 6); cloud(12, 40, 5); cloud(4, 33, 3);

  // дальние дома
  let c = 1;
  while (c < COLS - 1) {
    const w = 3 + Math.floor(R() * 4), h = 12 + Math.floor(R() * 13);
    for (let x = c; x < c + w; x++) for (let y = ground - h; y < ground; y++) set(y, x, 1);
    if (R() < .35) { const m = c + Math.floor(w / 2); for (let i = 1; i <= 3; i++) set(ground - h - i, m, 1); }
    c += w;
  }
  // ближние дома с окнами
  c = 1;
  while (c < COLS - 2) {
    const w = 5 + Math.floor(R() * 5), h = 7 + Math.floor(R() * 12), top = ground - h;
    for (let x = c; x < c + w && x < COLS - 1; x++) for (let y = top; y < ground; y++) set(y, x, 2);
    const roll = R();
    if (roll < .35) {
      for (let i = 1; i <= Math.ceil(w / 2); i++) for (let x = c + i - 1; x <= c + w - i; x++) set(top - i, x, 2);
    } else if (roll < .55) {
      const m = c + Math.floor(w / 2); for (let i = 1; i <= 4; i++) set(top - i, m, 2); set(top - 5, m, 3);
    }
    for (let y = top + 2; y < ground - 1; y += 2)
      for (let x = c + 1; x < c + w - 1; x += 2) if (R() < .7) set(y, x, 3);
    c += w + (R() < .35 ? 1 + Math.floor(R() * 2) : 0);
  }
  // земля и разметка
  for (let y = ground; y < ROWS; y++) for (let x = 0; x < COLS; x++) set(y, x, 2);
  for (let x = 2; x < COLS - 2; x += 5) { set(ground + 2, x, 3); set(ground + 2, x + 1, 3); }
  // кайма
  for (let x = 0; x < COLS; x++) { set(0, x, 3); set(ROWS - 1, x, 3); }
  for (let y = 0; y < ROWS; y++) { set(y, 0, 3); set(y, COLS - 1, 3); }
})();

// ---------- Порядок вязания (снизу вверх, змейкой, как ряды на спицах) ----------
function pos(k) {
  const rb = Math.floor(k / COLS), i = k % COLS;
  return { r: ROWS - 1 - rb, c: rb % 2 === 0 ? i : COLS - 1 - i };
}
function kOf(r, c) {
  const rb = ROWS - 1 - r;
  return rb * COLS + (rb % 2 === 0 ? c : COLS - 1 - c);
}

// ---------- Полотно ----------
const CW = 20, CH = 16;
const buf = document.createElement('canvas');
buf.width = COLS * CW; buf.height = ROWS * CH;
const bctx = buf.getContext('2d');
const jitter = Array.from({ length: N }, () => (Math.random() - .5) * 1.4);

function makeStitchSprite(y) {
  const c = document.createElement('canvas'); c.width = CW; c.height = CH;
  const g = c.getContext('2d');
  const leg = side => {
    g.save();
    g.translate(CW * (side < 0 ? .3 : .7), CH * .5);
    g.rotate(side * -1.08);
    const gr = g.createLinearGradient(0, -CH * .3, 0, CH * .3);
    gr.addColorStop(0, mix(y.main, y.light, .55));
    gr.addColorStop(.5, y.main);
    gr.addColorStop(1, mix(y.main, '#000000', .3));
    g.beginPath(); g.ellipse(0, 0, CH * .58, CW * .2, 0, 0, Math.PI * 2);
    g.fillStyle = gr; g.fill();
    g.beginPath(); g.ellipse(0, -CW * .05, CH * .4, CW * .06, 0, 0, Math.PI * 2);
    g.fillStyle = 'rgba(255,255,255,.18)'; g.fill();
    g.restore();
  };
  leg(-1); leg(1);
  return c;
}
const stitchSprites = YARNS.map(makeStitchSprite);
const gapColors = YARNS.map(y => mix(y.main, '#000000', .5));

function drawCell(k, b, s = 1) {
  const { r, c } = pos(k), x = c * CW, y = r * CH;
  bctx.clearRect(x, y, CW, CH);
  if (b < 0) return;
  bctx.fillStyle = gapColors[b];
  bctx.fillRect(x, y, CW, CH);
  const h = CH * s, j = jitter[k];
  bctx.drawImage(stitchSprites[b], x + j, y + (CH - h) / 2, CW, h);
}

// ---------- Состояние ----------
const cellBall = new Int8Array(N).fill(-1);
const used = [0, 0, 0, 0];
const anim = new Map();
let k = 0, acc = 0, active = [], unravel = false, flow = 0;

const target = kk => {
  if (!active.length) return -1;
  const { r, c } = pos(kk);
  return active[Math.min(G[r][c], active.length - 1)];
};

function repaint(now) {
  if (!active.length) return;
  for (let i = 0; i < k; i++) {
    const t = target(i);
    if (t !== cellBall[i]) {
      const rb = Math.floor(i / COLS);
      anim.set(i, { from: cellBall[i], to: t, start: now + rb * 28 + Math.random() * 60 });
    }
  }
}

function toggle(b) {
  if (unravel) return;
  const at = active.indexOf(b);
  if (at >= 0) active.splice(at, 1); else active.push(b);
  balls[b].pop = 1;
  repaint(performance.now());
  updateHint();
}

document.getElementById('reset').onclick = () => {
  if (k === 0) return;
  unravel = true; active = []; anim.clear(); updateHint();
};

const hintEl = document.getElementById('hint');
function updateHint() {
  const n = active.length;
  hintEl.textContent =
    unravel ? 'Распускаем…' :
    k >= N && n ? (n < 4 ? 'Ковёр готов! Добавь ещё цвет — узор станет богаче' : 'Ковёр готов — все четыре цвета в деле!') :
    n === 0 ? (k ? 'Пауза. Нажми на клубок, чтобы продолжить' : 'Нажми на клубок, чтобы начать вязать') :
    n === 1 ? 'Однотонное полотно. Добавь второй клубок — появится город' :
    n < 4 ? 'Добавь ещё цвет — появятся новые детали' : 'Все четыре цвета в деле!';
}
updateHint();

// ---------- Клубки ----------
function makeBallSprite(y, seed) {
  const S = 240, R = S / 2, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d'), rr = rng(seed);
  g.save();
  g.beginPath(); g.arc(R, R, R - 1, 0, Math.PI * 2); g.clip();
  g.fillStyle = mix(y.main, '#000000', .25); g.fillRect(0, 0, S, S);
  const dark = mix(y.main, '#000000', .4), mid = mix(y.main, y.light, .45);
  [0.25, 1.35, 2.35, -0.55, 0.85].forEach((a0, gi) => {
    for (let i = 0; i < 11; i++) {
      const ry = R * (0.1 + i * 0.085);
      g.save(); g.translate(R, R); g.rotate(a0 + rr() * .2);
      g.beginPath(); g.ellipse(0, 0, R * .99, ry, 0, gi % 2 ? 0 : Math.PI, gi % 2 ? Math.PI : Math.PI * 2);
      g.lineWidth = R * .06; g.strokeStyle = dark; g.stroke();
      g.lineWidth = R * .042; g.strokeStyle = (i + gi) % 3 === 0 ? y.light : (i % 2 ? y.main : mid); g.stroke();
      g.restore();
    }
  });
  const sh = g.createRadialGradient(R * .65, R * .55, R * .05, R, R, R);
  sh.addColorStop(0, 'rgba(255,255,255,.35)');
  sh.addColorStop(.45, 'rgba(255,255,255,0)');
  sh.addColorStop(1, 'rgba(0,0,0,.5)');
  g.fillStyle = sh; g.fillRect(0, 0, S, S);
  g.restore();
  return c;
}
const balls = YARNS.map((y, i) => ({ sprite: makeBallSprite(y, 17 + i * 31), rot: rng(i + 3)() * 6, pop: 0, hover: 0, x: 0, y: 0, r: 0 }));

// ---------- Фон ----------
const bgTile = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 160;
  const g = c.getContext('2d'), R = rng(5);
  g.fillStyle = '#efe4d2'; g.fillRect(0, 0, 160, 160);
  for (let i = 0; i < 900; i++) {
    const x = R() * 160, y = R() * 160, a = R() * Math.PI, l = 3 + R() * 7;
    g.strokeStyle = R() < .5 ? 'rgba(120,90,60,.07)' : 'rgba(255,255,255,.25)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  return c;
})();
const bgPattern = ctx => ctx.createPattern(bgTile, 'repeat');

// ---------- Канвас и раскладка ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, dpr, L = {}, pat;
function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pat = bgPattern(ctx);
  const zone = Math.min(Math.max(H * .26, 120), 200);
  const top = 64, fringe = 22;
  const availW = W - 48, availH = H - top - zone - fringe * 2;
  const s = Math.min(availW / buf.width, availH / buf.height);
  L.s = s; L.w = buf.width * s; L.h = buf.height * s;
  L.x = (W - L.w) / 2; L.y = top + fringe + (availH - L.h) / 2;
  const gw = Math.min(W - 20, 760), r = Math.min(zone * .34, gw / 8 * .82);
  balls.forEach((b, i) => { b.x = (W - gw) / 2 + gw * (i + .5) / 4; b.y = H - zone / 2 - 4; b.r = r; });
}
addEventListener('resize', layout);
layout();

// ---------- Ввод ----------
function hit(e) {
  const x = e.clientX, y = e.clientY;
  return balls.findIndex(b => Math.hypot(x - b.x, y - b.y) < b.r * 1.1);
}
let hovered = -1;
cv.addEventListener('pointermove', e => { hovered = hit(e); cv.style.cursor = hovered >= 0 ? 'pointer' : 'default'; });
cv.addEventListener('pointerleave', () => hovered = -1);
cv.addEventListener('pointerdown', e => { const i = hit(e); if (i >= 0) toggle(i); });

// ---------- Цикл ----------
function cellScreen(kk) {
  const { r, c } = pos(Math.min(kk, N - 1));
  return { x: L.x + (c + .5) * CW * L.s, y: L.y + (r + .5) * CH * L.s, top: L.y + r * CH * L.s };
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  const knitting = active.length && !unravel && k < N;

  // вязание
  if (knitting) {
    acc += dt * (70 + active.length * 35);
    while (acc >= 1 && k < N) {
      const b = target(k);
      cellBall[k] = b; used[b]++; drawCell(k, b); k++; acc--;
      if (k === N) updateHint();
    }
    flow += dt * 60;
  } else acc = 0;

  // распускание
  if (unravel) {
    let n = Math.ceil(dt * 900);
    while (n-- > 0 && k > 0) { k--; drawCell(k, -1); cellBall[k] = -1; }
    if (k === 0) { unravel = false; used.fill(0); updateHint(); }
  }

  // перекрашивание при смене палитры
  for (const [i, a] of anim) {
    if (i >= k) { anim.delete(i); continue; }
    if (now < a.start) continue;
    const p = (now - a.start) / 260;
    if (p >= 1) {
      if (cellBall[i] >= 0) used[cellBall[i]]--;
      cellBall[i] = a.to; used[a.to]++; drawCell(i, a.to); anim.delete(i);
    } else if (p < .5) drawCell(i, a.from, 1 - p * 2);
    else drawCell(i, a.to, p * 2 - 1);
  }

  render(now, knitting);
  requestAnimationFrame(frame);
}

function render(now, knitting) {
  const t = now / 1000;
  ctx.fillStyle = pat; ctx.fillRect(0, 0, W, H);

  // контур будущего ковра
  ctx.save();
  ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(140,110,80,.35)'; ctx.lineWidth = 1.5;
  ctx.strokeRect(L.x, L.y, L.w, L.h);
  ctx.restore();

  const rowsDone = Math.ceil(k / COLS);
  if (k > 0) {
    const yTop = L.y + (ROWS - rowsDone) * CH * L.s;
    // тень
    ctx.save();
    ctx.shadowColor = 'rgba(80,50,20,.3)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    ctx.fillStyle = 'rgba(80,50,20,.25)';
    const fullTop = L.y + (ROWS - Math.floor(k / COLS)) * CH * L.s;
    ctx.fillRect(L.x + 2, fullTop, L.w - 4, L.y + L.h - fullTop);
    ctx.restore();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(buf, L.x, L.y, L.w, L.h);

    // бахрома
    const fr = (r, dir) => {
      for (let c = 1; c < COLS; c += 2) {
        const kk = kOf(r, c); if (kk >= k || cellBall[kk] < 0) continue;
        const x = L.x + (c + .5) * CW * L.s, y0 = dir > 0 ? L.y + L.h : L.y;
        ctx.strokeStyle = YARNS[cellBall[kk]].main;
        ctx.lineWidth = Math.max(1.5, CW * L.s * .45); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x, y0);
        ctx.quadraticCurveTo(x + Math.sin(t * 1.5 + c) * 2, y0 + dir * 10, x + Math.sin(t * 1.2 + c * .7) * 3, y0 + dir * 18);
        ctx.stroke();
      }
    };
    fr(ROWS - 1, 1);
    if (k >= N) fr(0, -1);

    // спицы
    if (k < N) {
      const head = cellScreen(k);
      const ny = yTop + 1;
      drawNeedle(L.x - 26, ny, L.x + L.w + 26, ny, t);
      const wob = knitting ? Math.sin(t * 22) * 3 : 0;
      drawNeedle(head.x - 70, head.y + 26 + wob, head.x + 40, head.y - 30 - wob, t);
    }
  }

  // нитки
  const head = cellScreen(k < N ? k : N - 1);
  const hx = head.x + (knitting ? Math.sin(t * 22) * 2 : 0), hy = head.y;
  active.forEach((bi, order) => {
    const b = balls[bi], y = YARNS[bi];
    const ang = Math.atan2(hy - b.y, hx - b.x);
    const sx = b.x + Math.cos(ang) * b.r * .85 * b.sc, sy = b.y + Math.sin(ang) * b.r * .85 * b.sc;
    const mx = (sx + hx) / 2 + Math.sin(t * 1.3 + bi) * 10, my = (sy + hy) / 2 + 30 + Math.sin(t * 1.7 + bi * 2) * 8;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(2.5, b.r * .07);
    ctx.strokeStyle = mix(y.main, '#000000', .2);
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(mx, my, hx, hy); ctx.stroke();
    ctx.setLineDash([3, 5]); ctx.lineDashOffset = -flow;
    ctx.lineWidth *= .55; ctx.strokeStyle = y.light;
    ctx.stroke();
    ctx.restore();
  });

  // клубки
  balls.forEach((b, i) => {
    const on = active.includes(i);
    b.hover += ((hovered === i ? 1 : 0) - b.hover) * .2;
    b.pop *= .88;
    if (on && knitting) b.rot += .03;
    const shrink = 1 - .28 * Math.min(1, used[i] / N * 1.6);
    b.sc = shrink * (1 + b.hover * .06 + b.pop * .12);
    const bob = on && knitting ? Math.sin(t * 9 + i) * 2 : 0;
    const r = b.r * b.sc, x = b.x, y = b.y + bob;

    // тень на столе
    ctx.fillStyle = 'rgba(80,50,20,.18)';
    ctx.beginPath(); ctx.ellipse(x, b.y + b.r * .95, r * .9, r * .2, 0, 0, Math.PI * 2); ctx.fill();

    if (on) {
      ctx.save();
      ctx.strokeStyle = YARNS[i].main; ctx.globalAlpha = .45; ctx.lineWidth = 2.5;
      ctx.setLineDash([5, 6]); ctx.lineDashOffset = -t * 20;
      ctx.beginPath(); ctx.arc(x, y, r * 1.14, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(x, y); ctx.rotate(b.rot);
    ctx.drawImage(b.sprite, -r, -r, r * 2, r * 2);
    ctx.restore();

    // этикетка с логотипом
    const im = YARNS[i].image, ls = r * .82;
    if (im.complete && im.naturalWidth) {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(-.12 + Math.sin(t * 2 + i) * (on ? .05 : .015));
      ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
      roundRect(-ls / 2 - 3, -ls / 2 - 3, ls + 6, ls + 6, ls * .24); ctx.fillStyle = '#fffaf2'; ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.drawImage(im, -ls / 2, -ls / 2, ls, ls);
      ctx.restore();
    }

    // номер в очереди цветов
    if (on) {
      const o = active.indexOf(i) + 1, bx = x + r * .78, by = y - r * .78, br = Math.max(10, r * .2);
      ctx.fillStyle = '#fffaf2'; ctx.strokeStyle = YARNS[i].main; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#5a4636'; ctx.font = `700 ${Math.round(br * 1.1)}px Comfortaa, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(o, bx, by + 1);
    }
  });
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawNeedle(x1, y1, x2, y2) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(60,35,15,.25)'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(x1, y1 + 3); ctx.lineTo(x2, y2 + 3); ctx.stroke();
  ctx.strokeStyle = '#c99257'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,240,210,.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x1, y1 - 1); ctx.lineTo(x2, y2 - 1); ctx.stroke();
  ctx.fillStyle = '#8a5a2b';
  ctx.beginPath(); ctx.arc(x1, y1, 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

requestAnimationFrame(frame);
</script>
</body>
</html>
